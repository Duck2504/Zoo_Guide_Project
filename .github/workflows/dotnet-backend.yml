name: Core Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Backend_core/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Backend_core/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend_core/ZooAudioGuide.API

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Khôi phục các thư viện (Restore)
        run: dotnet restore

      - name: Biên dịch (Build)
        run: dotnet build --no-restore --configuration Release

      # (Tùy chọn) Chạy Unit Test nếu dự án có viết test
      - name: Chạy kiểm thử (Test)
        run: dotnet test --no-build --configuration Release