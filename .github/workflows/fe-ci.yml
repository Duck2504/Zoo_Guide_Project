name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # Tự động chạy khi có code mới đẩy lên nhánh main
    paths:
      - 'Frontend_Web/**' # Chỉ kích hoạt khi có thay đổi trong thư mục Frontend
  workflow_dispatch: # Cho phép chạy thủ công từ giao diện GitHub

# Cấp quyền cho GitHub Actions ghi file lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Trỏ vào đúng tên thư mục Frontend của em
        working-directory: ./Frontend_Web 
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend_Web/package-lock.json'

      - name: Cài đặt thư viện
        run: npm ci

      - name: Đóng gói (Build)
        run: npm run build

      - name: Tải file dist lên artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend_Web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4