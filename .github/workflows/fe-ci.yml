name: Deploy Frontend to SmarterASP

on:
  push:
    branches: ["main"]
    paths:
      - 'Frontend_Web/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './Frontend_Web/package-lock.json'

      - name: Cài đặt thư viện
        working-directory: ./Frontend_Web
        run: npm ci

      - name: Đóng gói (Build)
        working-directory: ./Frontend_Web
        run: npm run build

      - name: Đẩy file lên SmarterASP qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Thư mục chứa file sau khi build của React (bắt buộc có dấu / ở cuối)
          local-dir: ./Frontend_Web/dist/
          # Thư mục trên hosting SmarterASP (thường là /site1/wwwroot/)
          server-dir: /site1/wwwroot/