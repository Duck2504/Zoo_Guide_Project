name: Frontend (Web Admin & Mobile App) CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend_Web/**'
      - 'Frondend_MobileApp/**'
      - '.github/workflows/fe-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Frontend_Web/**'
      - 'Frondend_MobileApp/**'

jobs:
  # =======================================================
  # 1. CI JOB CHO WEB ADMIN (REACT.JS)
  # =======================================================
  web-admin-ci:
    name: Frontend Web Admin (React.js) CI Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend_Web

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend_Web/package-lock.json

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Linter Check
        run: npm run lint --if-present

      - name: 🧪 Unit Tests
        run: npm test --if-present

      - name: 🏗️ Build Production Bundle (Vite)
        run: npm run build

  # =======================================================
  # 2. CI JOB CHO MOBILE APP (REACT NATIVE)
  # =======================================================
  mobile-app-ci:
    name: Frontend Mobile App (React Native / Expo) CI Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frondend_MobileApp

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Mobile Dependencies
        run: npm install

      - name: 🔍 Check React Native App.js Syntax
        run: node -c App.js
